<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>SECTOR 7</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;color:#d8f4ff;user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;opacity:.85}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
#cross:before{left:10px;top:0;width:2px;height:22px;-webkit-mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%)}
#cross:after{top:10px;left:0;height:2px;width:22px;-webkit-mask:linear-gradient(90deg,#000 35%,transparent 35% 65%,#000 65%)}
#hit{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border:2px solid #ff4a3a;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.b{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:15px;letter-spacing:.04em;text-shadow:0 0 8px #000}
#hp{left:28px;width:260px}#hp div{height:10px;background:#0008;border:1px solid #9fd8ff66;margin-top:6px}
#hpf{height:100%!important;border:0!important;margin:0!important;width:100%;background:linear-gradient(90deg,#ff6a2a,#ffd36a)}
#am{right:28px;text-align:right;font-size:38px;line-height:1}#am small{font-size:14px;display:block;opacity:.7}
#kl{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:18px;text-shadow:0 0 8px #000}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(#0a1a24cc,#000e);cursor:pointer}
#ov h1{font-size:64px;margin:0 0 6px;letter-spacing:.18em;font-weight:700;color:#ffb26a;text-shadow:0 0 30px #ff6a2a88}
#ov p{margin:6px 0;opacity:.85;line-height:1.5}
</style></head><body>
<div id="hud"><div id="cross"></div><div id="hit"></div><div id="kl">Дроны: 0 / 10</div>
<div class="b" id="hp">ЗДОРОВЬЕ<div><div id="hpf"></div></div></div><div class="b" id="am"><small>ПЕРЕЗАРЯДКА: R</small><span id="ammo">30</span></div></div>
<div id="ov"><div><h1>SECTOR 7</h1><p>Уничтожь 10 охранных дронов в заброшенном бункере.</p>
<p>WASD — движение · Shift — бег · Мышь — прицел · ЛКМ — огонь<br>R — перезарядка · F — фонарь</p><p id="msg"><b>Нажми, чтобы начать</b></p></div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="src/core/PerformanceMonitor.js"></script>
<script src="src/core/GraphicsSettings.js"></script>
<script src="src/ai/DroneAI.js"></script>
<script src="src/combat/WeaponSystem.js"></script>
<script src="src/game.js"></script>
</body></html>
