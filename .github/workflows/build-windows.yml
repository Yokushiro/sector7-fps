name: Windows Build Check

on:
  push:
    branches: [feature/sector7-2-core]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portable and installer
        run: npm run dist
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: sector7-windows-build
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
